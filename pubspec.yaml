name: two_zero_four_eight
description: 2048 — Game Hub module.

# Mobile bundle identifiers
#   Android: applicationId = com.elbaftech.game_hub.two_zero_four_eight
#   iOS:     CFBundleIdentifier = com.elbaftech.game_hub.two_zero_four_eight
